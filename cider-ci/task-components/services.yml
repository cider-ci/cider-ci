ports:
  CIDER_CI_TEST_SERVER_HTTP_PORT:
    min: 3200
    max: 3299
  CIDER_CI_TEST_RV_HTTP_PORT:
    min: 3200
    max: 3299

environment_variables:
  INTEGRATION_TESTS_DIR: "{{CIDER_CI_WORKING_DIR}}/integration-tests"

scripts:

  services_ready_to_run:
    start_when:
      ui is ready to run:
        script_key: ci-ui_ready-to-run
      server is ready to run:
        script_key: ci-server_ready-to-run
    body: |
      #!/usr/bin/env bash
      set -euo pipefail
      echo "Services are ready to run"

  ci-server_run:
    start_when:
      services_ready_to_run passed:
        script_key: services_ready_to_run

