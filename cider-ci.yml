  integration-tests-preflight:
    name: Preflight Integration Tests
    run_when:
      any branch has been updated:
        type: branch
        include_match: ^.*$
    context:
      task_defaults:
        environment_variables:
          CIDER_CI_TEST_SERVER_DIR: '{{CIDER_CI_WORKING_DIR}}/server'
          CIDER_CI_TEST_UI_DIR: '{{CIDER_CI_WORKING_DIR}}/user-interface'
        include:
        - path: cider-ci/task-components/service.yml
          submodule: ['server']
        - path: cider-ci/task-components/ui-service.yml
        - path: cider-ci/task-components/services.yml
        - path: cider-ci/task-components/reverse-proxy.yml
          submodule: ['integration-tests']
        git_options:
          submodules:
            include_match: ^.*$
        traits:
          - asdf
      tasks:
        task_wip:
          scripts:
            test:
              body: |
                #!/usr/bin/env bash
                set -eou pipefail
                echo "OK"

  integration-tests:
    name: Integration Tests
    depends_on: &INT_SPEC_DEPENDS
      specs preflight passed:
        type: job
        job_key: integration-tests-preflight
        states: [passed]
    run_when: *INT_SPEC_DEPENDS
    context:
      task_defaults:
        environment_variables:
          CIDER_CI_TEST_SERVER_DIR: '{{CIDER_CI_WORKING_DIR}}/server'
          CIDER_CI_TEST_UI_DIR: '{{CIDER_CI_WORKING_DIR}}/user-interface'
        include:
        - path: cider-ci/task-components/service.yml
          submodule: ['server']
        - path: cider-ci/task-components/ui-service.yml
        - path: cider-ci/task-components/services.yml
        - path: cider-ci/task-components/reverse-proxy.yml
          submodule: ['integration-tests']
        git_options:
          submodules:
            include_match: ^.*$
        traits:
          - asdf
      tasks:
        task_wip:
          scripts:
            test:
              body: |
                #!/usr/bin/env bash
                set -eou pipefail
                cd integration-tests
                ./bin/rspec spec/features/public-page_spec.rb


